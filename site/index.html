<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Watermark_killer：粘贴豆包等平台分享链接，一键解析无水印视频" />
  <meta name="theme-color" content="#111111" />
  <title>Watermark_killer · 视频去水印</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <span class="brand">✂️ Watermark_killer</span>
      <span class="header-sub">视频去水印工具</span>
    </div>
  </header>

  <main class="app-main">
    <!-- 首页 -->
    <section id="view-home" class="view active">
      <div class="home-hero">
        <h1 class="hero-title">粘贴链接，去水印下载</h1>
        <p class="hero-desc">支持豆包 AI 视频分享链接去水印</p>
      </div>
      <div class="input-card">
        <textarea id="share-input" rows="4" placeholder="粘贴豆包视频分享链接，如：https://www.doubao.com/video-sharing?source_type=mobile&amp;share_id=xxx&amp;video_id=xxx"></textarea>
        <div id="detect-bar" class="detect-bar hidden"></div>
        <button id="parse-btn" class="btn-primary">开始解析</button>
        <p class="input-tip">粘贴后自动识别平台 · 仅解析您有权使用的内容</p>
      </div>
      <div id="home-status" class="status-area"></div>
      <div class="recent-card">
        <h2 class="card-title">最近解析</h2>
        <ul id="recent-list" class="recent-list"></ul>
      </div>
    </section>

    <!-- 解析结果 -->
    <section id="view-result" class="view">
      <div class="result-head">
        <button id="result-back" class="btn-ghost">← 返回</button>
        <span id="result-platform" class="platform-badge"></span>
      </div>
      <div id="result-body" class="result-body"></div>
    </section>

    <!-- 历史记录 -->
    <section id="view-history" class="view">
      <div class="section-title-row">
        <h2 class="card-title">历史记录</h2>
        <button id="history-clear" class="btn-ghost danger">清空</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
      <p id="history-empty" class="empty-tip">暂无记录</p>
    </section>

    <!-- 常见问题 -->
    <section id="view-faq" class="view">
      <h2 class="card-title">常见问题</h2>
      <div id="faq-body" class="faq-body"></div>
    </section>

    <!-- 使用教程 -->
    <section id="view-course" class="view">
      <h2 class="card-title">使用教程</h2>
      <div id="course-body" class="course-body"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab-item active" data-view="home">🏠<span>首页</span></button>
    <button class="tab-item" data-view="history">🕘<span>历史</span></button>
    <button class="tab-item" data-view="faq">❓<span>问题</span></button>
    <button class="tab-item" data-view="course">📖<span>教程</span></button>
  </nav>

  <footer class="app-footer">
    <p>本工具仅用于去除您有合法使用权的内容水印，请遵守平台规则与相关法律法规。</p>
    <p>Watermark_killer Web 版 · 学习复刻项目</p>
  </footer>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
